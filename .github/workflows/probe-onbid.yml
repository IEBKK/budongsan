# 온비드 응답 원문 진단용. 특정 물건관리번호의 raw <item> XML 을 로그로 덤프한다.
# (최저입찰가가 감정가의 1% 로 파싱되는 물건들의 원문 확인 — 2026-09-05)
name: probe-onbid

on:
  workflow_dispatch:
    inputs:
      mgmt_nos:
        description: '물건관리번호 콤마 구분'
        default: '2025-03388-001,2025-10929-001,2025-12049-002'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: 원문 덤프
        env:
          ONBID_SERVICE_KEY: ${{ secrets.ONBID_SERVICE_KEY }}
          MGMT_NOS: ${{ inputs.mgmt_nos }}
        run: |
          python - <<'EOF'
          import os, re, requests, xml.etree.ElementTree as ET
          import sys
          sys.path.insert(0, ".")
          from pipeline.sources.onbid import ENDPOINT, PRPT_DIV_CDS

          wanted = set(os.environ["MGMT_NOS"].split(","))
          key = os.environ["ONBID_SERVICE_KEY"]
          found = suspicious = scanned = 0
          for prpt in PRPT_DIV_CDS:
              for pvct in ("Y", "N"):
                  for page in range(1, 41):
                      r = requests.get(ENDPOINT, params={
                          "serviceKey": key, "prptDivCd": prpt, "pvctTrgtYn": pvct,
                          "numOfRows": 200, "pageNo": page}, timeout=30)
                      root = ET.fromstring(r.text)
                      items = list(root.iter("item"))
                      scanned += len(items)
                      for item in items:
                          mgmt = (item.findtext("cltrMngNo") or "").strip()
                          low = re.sub(r"\D", "", item.findtext("lowstBidPrcIndctCont") or "")
                          aps = re.sub(r"\D", "", item.findtext("apslEvlAmt") or "")
                          if low and aps and int(low) > 0 and 90 <= int(aps) / int(low) <= 110:
                              suspicious += 1
                              if suspicious <= 3:
                                  wanted.add(mgmt)
                          if mgmt in wanted:
                              print(f"=== {mgmt} (prpt={prpt} pvct={pvct}) ===")
                              print(ET.tostring(item, encoding="unicode")[:2500])
                              wanted.discard(mgmt)
                              found += 1
                      if len(items) < 200:
                          break
          print(f"스캔 {scanned} / 덤프 {found} / 100배 의심 {suspicious} / 미발견 {sorted(wanted)}")
          EOF
